<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conference App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="pt-5">

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar navbar-expand navbar-dark bg-dark fixed-top">
    <div class="container">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-white" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#about">About</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#speakers">Speakers</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="#schedule">Schedule</a></li>
      </ul>
      <span class="navbar-text text-white">Powered By <span class="text-warning">PARAGRAPH</span></span>
    </div>
  </nav>

  <!-- ========== HERO ========== -->
  <header id="home" class="bg-warning text-center py-5">
    <div class="container py-3">
      <h1 class="display-4">Full Stack Conf</h1>
      <p class="lead mb-4">A One-Day Conference About All Things JavaScript</p>
      <div class="btn-group">
        <button type="button" class="btn btn-secondary btn-lg" data-bs-toggle="modal" data-bs-target="#register">Register Now</button>
        <a class="btn btn-dark btn-lg" href="#speakers">See Speakers</a>
      </div>
    </div>
  </header>

  
  <!-- ========== ABOUT (Person 2) | id="about" ========== -->

  <!-- ========== END ABOUT ========== -->


  <!-- ========== SPEAKERS (Person 2) | id="speakers" ========== -->

  <!-- ========== END SPEAKERS ========== -->


  <!-- ========== SCHEDULE (Person 3) | id="schedule" ========== -->

  <!-- ========== END SCHEDULE ========== -->


  <!-- ========== FOOTER (Person 3) ========== -->

  <!-- ========== END FOOTER ========== -->


  <!-- ========== REGISTER MODAL (Person 4) | id="register" ========== -->
  
  <div class="modal fade" id="register" tabindex="-1" aria-labelledby="registerLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">

        <!-- Header -->
        <div class="modal-header bg-warning">
          <h5 class="modal-title" id="registerLabel">Register for Conference</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">

          <!-- Closable alert -->
          <div class="alert alert-warning alert-dismissible fade show" role="alert">
            <strong>Hurry!</strong> Only a few spots left.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

          <form>
            <!-- Basic Info -->
            <h6 class="mt-3">Basic Info</h6>
            <div class="mb-3">
              <label for="regName" class="form-label">Name</label>
              <input type="text" class="form-control" id="regName" placeholder="Your name">
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="regEmail" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label for="regJob" class="form-label">Job Role</label>
              <select class="form-select" id="regJob">
                <option selected>Full Stack JS Developer</option>
              </select>
            </div>

            <!-- Topics -->
            <h6 class="mt-4">Topics</h6>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="topic1">
              <label class="form-check-label" for="topic1">Topic 1</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="topic2">
              <label class="form-check-label" for="topic2">Topic 2</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="topic3">
              <label class="form-check-label" for="topic3">Topic 3</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="topic4">
              <label class="form-check-label" for="topic4">Topic 4</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="topic5">
              <label class="form-check-label" for="topic5">Topic 5</label>
            </div>

            <!-- Payment Info -->
            <h6 class="mt-4">Payment Info</h6>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="cardNumber" class="form-label">Card Number</label>
                <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9012 3456">
              </div>
              <div class="col-md-3">
                <label for="zip" class="form-label">Zip Code</label>
                <input type="text" class="form-control" id="zip">
              </div>
              <div class="col-md-3">
                <label for="cvv" class="form-label">CVV</label>
                <input type="text" class="form-control" id="cvv">
              </div>
            </div>
            <div class="row g-3 mb-4">
              <div class="col-6">
                <label for="expMonth" class="form-label">Expiration Month</label>
                <select class="form-select" id="expMonth">
                  <option selected>Month</option>
                  <option>01</option><option>02</option><option>03</option>
                  <option>04</option><option>05</option><option>06</option>
                  <option>07</option><option>08</option><option>09</option>
                  <option>10</option><option>11</option><option>12</option>
                </select>
              </div>
              <div class="col-6">
                <label for="expYear" class="form-label">Expiration Year</label>
                <select class="form-select" id="expYear">
                  <option selected>Year</option>
                  <option>2026</option><option>2027</option><option>2028</option>
                  <option>2029</option><option>2030</option>
                </select>
              </div>
            </div>

            <!-- Register button -->
            <button type="button" class="btn btn-dark btn-lg">Register</button>
          </form>
        </div>

      </div>
    </div>
  </div>
  <!-- ========== END REGISTER MODAL ========== -->


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
